{% extends "base.html" %}
{% from "macros.html" import flashes %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-art">
      <svg viewBox="0 0 320 280" aria-hidden="true">
        <g transform="rotate(-9 160 140)">
          <rect x="44" y="34" width="214" height="34" rx="4" fill="#7a4a24"/>
          <rect x="44" y="34" width="214" height="7" rx="3" fill="rgba(255,255,255,.14)"/>
          <rect x="74" y="72" width="206" height="34" rx="4" fill="#a8743a"/>
          <rect x="74" y="72" width="206" height="7" rx="3" fill="rgba(255,255,255,.16)"/>
          <rect x="36" y="110" width="224" height="34" rx="4" fill="#5a331a"/>
          <rect x="36" y="110" width="224" height="7" rx="3" fill="rgba(255,255,255,.1)"/>
          <rect x="62" y="148" width="216" height="34" rx="4" fill="#d3b47c"/>
          <rect x="62" y="148" width="216" height="7" rx="3" fill="rgba(255,255,255,.25)"/>
          <rect x="40" y="186" width="206" height="34" rx="4" fill="#8a5a2b"/>
          <rect x="40" y="186" width="206" height="7" rx="3" fill="rgba(255,255,255,.14)"/>
          <rect x="70" y="224" width="212" height="34" rx="4" fill="#ead9b4"/>
          <rect x="70" y="224" width="212" height="7" rx="3" fill="rgba(255,255,255,.4)"/>
        </g>
      </svg>
      <div class="auth-brand">PUSTAKA<small>Ribuan buku, satu tempat.</small></div>
    </div>
    <div class="auth-form">
      <div class="auth-top">{% block toplink %}{% endblock %}</div>
      {{ flashes() }}
      {% block form %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
